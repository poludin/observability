alloy:
  configMap:
    content: |
      // 1. Находим все поды на текущей ноде Kubernetes
      discovery.kubernetes "pods" {
        role = "pod"
      }
      // 2. Читаем логи из найденных подов
      loki.source.kubernetes "local_pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.write.local.receiver]
      }
      // 3. Отправляем собранные логи в базу данных Loki
      loki.write "local" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

